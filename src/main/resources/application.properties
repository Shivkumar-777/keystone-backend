spring.application.name=keystone-backend

# ===============================
# PostgreSQL Database Configuration
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/keystone
spring.datasource.username=postgres
spring.datasource.password=Postgres@123

# ===============================
# Hibernate Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable Open Session in View (recommended for REST APIs)
spring.jpa.open-in-view=false

# ===============================
# Flyway Configuration
# ===============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ===============================
# Server Configuration
# ===============================
server.port=8081

# ===============================
# File Upload Configuration
# ===============================
file.upload-dir=uploads

# Maximum size of a single uploaded file
spring.servlet.multipart.max-file-size=20MB

# Maximum total request size
spring.servlet.multipart.max-request-size=50MB

# ===============================
# Debug Logging
# ===============================
debug=true