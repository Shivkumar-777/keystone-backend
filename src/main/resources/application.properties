spring.application.name=keystone-backend

# ===============================
# PostgreSQL Database Configuration
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/keystone
spring.datasource.username=postgres
spring.datasource.password=Postgres@123

# ===============================
# Hibernate Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# PostgreSQL dialect is detected automatically by Hibernate 7,
# so this property is no longer required.
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# Server Configuration
# ===============================
server.port=8080

# ===============================
# File Upload Configuration
# ===============================
# Directory where uploaded files will be stored
file.upload-dir=uploads

# Maximum size of a single uploaded file
spring.servlet.multipart.max-file-size=20MB

# Maximum total request size
spring.servlet.multipart.max-request-size=50MB